[package]
name = "pictorus-ffi"
edition = "2024"
description = "Runtime and peripheral adapters backing the Pictorus C FFI."
version = "0.0.0"
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
pictorus-traits = { path = "../pictorus-traits", version = "0.0.0" }
pictorus-blocks = { path = "../pictorus-blocks", version = "0.0.0" }
pictorus-internal = { path = "../pictorus-internal", version = "0.0.0" }
serde = { version = "1.0.219", default-features = false }
embedded-can = "0.4.1"
log = "0.4.21"

# The runtime only owns the allocator and panic handler where there is no OS to
# provide them.
[target.'cfg(target_os = "none")'.dependencies]
embedded-alloc = "0.5.1"
critical-section = "1.2.0"

[features]
default = []
# The generated app allocates. On bare metal the runtime provides the global
# allocator, backed by the heap passed to `pictorus_rt_init`.
alloc = ["pictorus-internal/alloc", "pictorus-blocks/alloc"]
# Build for a platform with an operating system. The system allocator and panic
# handler are used, and the heap and panic fields of the runtime config are ignored.
#
# This also enables the blocks that need `std`, which is where the UDP blocks live.
std = ["alloc", "pictorus-internal/std", "pictorus-blocks/std"]
