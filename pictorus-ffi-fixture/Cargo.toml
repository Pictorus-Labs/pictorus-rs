[package]
name = "pictorus-ffi-fixture"
edition = "2024"
description = "Hand-written stand-in for a generated `ffi_lib`, used to test `pictorus-ffi` from C."
version = "0.0.0"
publish = false
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
# `rlib` is what lets cargo build the staticlib as part of `cargo test`.
crate-type = ["staticlib", "rlib"]

[dependencies]
pictorus-ffi = { path = "../pictorus-ffi", version = "0.0.0" }

[features]
default = ["std"]
alloc = ["pictorus-ffi/alloc"]
std = ["alloc", "pictorus-ffi/std"]
